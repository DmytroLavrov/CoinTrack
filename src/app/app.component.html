<div class="container">
  <header>
    <h1>🪙 CoinTrack</h1>
    <p>Real-time Crypto Dashboard</p>
  </header>

  <main>
    <!-- Connection Status -->
    <div class="status" [class]="statusClass()">
      <span class="status-dot" [class]="statusDotClass()"></span>
      {{ statusText() }}
    </div>

    <!-- Price Ticker -->
    <div class="ticker" [class.flash-up]="isFlashUp()" [class.flash-down]="isFlashDown()">
      <div class="ticker-symbol">{{ cryptoService.tickerData().symbol }}</div>

      <div class="ticker-price" [class.price-up]="isTrendUp()" [class.price-down]="isTrendDown()">
        ${{ cryptoService.tickerData().priceFormatted }}

        @if (isTrendUp()) {
          <span class="trend-icon">↑</span>
        }
        @if (isTrendDown()) {
          <span class="trend-icon">↓</span>
        }
      </div>

      <div class="ticker-time">
        Last update: {{ formatTime(cryptoService.tickerData().timestamp) }}
      </div>
    </div>
  </main>
</div>
